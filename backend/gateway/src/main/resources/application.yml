# ======================================================
# Configuración general del microservicio (API Gateway)
# ======================================================
spring:
  application:
    name: gateway-service

  # ======================================================
  # Seguridad (Keycloak + JWT)
  # ======================================================
  security:
    oauth2:
      resourceserver:
        jwt:
          # En dev: localhost:8181
          # En Docker: KEYCLOAK_URL=http://keycloak:8080
          issuer-uri: ${KEYCLOAK_ISSUER_URI:${KEYCLOAK_URL:http://localhost:8181}/realms/${KEYCLOAK_REALM:unicauca}}
          # jwk-set-uri opcional:
          # jwk-set-uri: ${KEYCLOAK_JWKS_URI:${KEYCLOAK_URL:http://localhost:8181}/realms/${KEYCLOAK_REALM:unicauca}/protocol/openid-connect/certs}

  # ======================================================
  # Spring Cloud Gateway
  # ======================================================
  cloud:
    gateway:
      # --------------------------------------------------
      # Rutas (proxy hacia microservicios)
      # --------------------------------------------------
      routes:
        # ---------------- Auth ----------------
        - id: auth-service
          uri: http://${AUTH_SERVICE_HOST:localhost}:${AUTH_SERVICE_PORT:8081}
          predicates:
            - Path=/api/auth/**
          filters:
            - StripPrefix=2

        # ---------------- Academic ----------------
        - id: academic-project-service
          uri: http://${ACADEMIC_SERVICE_HOST:localhost}:${ACADEMIC_SERVICE_PORT:8082}
          predicates:
            - Path=/api/academic/**
          filters:
            - StripPrefix=2
            - name: RequestSize
              args:
                maxSize: 60MB
            - AddResponseHeader=Cache-Control, no-store

        # ---------------- Coordinator ----------------
        - id: coordinator-service
          uri: http://${COORD_SERVICE_HOST:localhost}:${COORD_SERVICE_PORT:8083}
          predicates:
            - Path=/api/coordinator/**
          filters:
            - StripPrefix=2
            - name: RequestSize
              args:
                maxSize: 60MB
            - AddResponseHeader=Cache-Control, no-store

        # ---------------- Department Head ----------------
        - id: department-head-service
          uri: http://${DEPT_SERVICE_HOST:localhost}:${DEPT_SERVICE_PORT:8084}
          predicates:
            - Path=/api/department/**
          filters:
            - StripPrefix=2
            - name: RequestSize
              args:
                maxSize: 60MB
            - AddResponseHeader=Cache-Control, no-store

        # ---------------- Notification ----------------
        - id: notification-service
          uri: http://${NOTIF_SERVICE_HOST:localhost}:${NOTIF_SERVICE_PORT:8085}
          predicates:
            - Path=/api/notification/**
          filters:
            - StripPrefix=2

      # --------------------------------------------------
      # Filtros globales (headers seguros)
      # --------------------------------------------------
      default-filters:
        - name: AddResponseHeader
          args: { name: X-Content-Type-Options, value: nosniff }
        - name: AddResponseHeader
          args: { name: Referrer-Policy, value: no-referrer }

      # --------------------------------------------------
      # CORS global
      # --------------------------------------------------
      globalcors:
        add-to-simple-url-handler-mapping: true
        cors-configurations:
          '[/**]':
            allowed-origins: "*"
            allowed-methods: "*"
            allowed-headers: "*"
            allow-credentials: false
            exposed-headers:
              - Content-Disposition
              - Content-Length
              - Content-Type
              - ETag
              - Last-Modified
            max-age: 3600

      # --------------------------------------------------
      # Cliente HTTP (timeouts)
      # --------------------------------------------------
      httpclient:
        connect-timeout: 3000
        response-timeout: 5s

# ======================================================
# Servidor embebido (Netty)
# ======================================================
server:
  port: ${GATEWAY_PORT:8080}

# ======================================================
# Actuator
# ======================================================
management:
  endpoint:
    gateway:
      access: read-only
    health:
      show-details: always
  endpoints:
    web:
      exposure:
        include: health,info,gateway
      cors:
        allowed-origins: "*"
        allowed-methods: "*"
        allowed-headers: "*"
        allow-credentials: false

# ======================================================
# Logging
# ======================================================
logging:
  level:
    root: INFO
    org.springframework.cloud.gateway: DEBUG
    org.springframework.web: INFO
  file:
    name: logs/${spring.application.name}.log
