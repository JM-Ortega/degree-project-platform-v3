# ======================================================
# Configuracion general del microservicio
# ======================================================
spring:
  application:
    name: auth-service   # Nombre del microservicio

  # ======================================================
  #  Configuracion de base de datos (PostgreSQL)
  # ======================================================
  datasource:
    # En dev: localhost, en Docker: DB_HOST=postgres (por ejemplo)
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/auth_db
    username: ${DB_USER:auth_user}
    password: ${DB_PASS:auth_pass}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  # ======================================================
  # Configuracion de mensajeria (RabbitMQ)
  # ======================================================
  rabbitmq:
    # En dev: localhost, en Docker: RABBITMQ_HOST=rabbitmq
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:appuser}
    password: ${RABBITMQ_PASS:apppass}
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true
    listener:
      simple:
        acknowledge-mode: auto
        concurrency: 2
        max-concurrency: 8
        prefetch: 20
        default-requeue-rejected: false

# ======================================================
# Topologia de mensajeria (nombres reutilizables)
# ======================================================
messaging:
  exchange:
    main: degree.events
    dlx: degree.dlx
  queues:
    auth: auth-service.q
    project: academic-project-service.q
    coordinator: coordinator-service.q
    department: department-head-service.q
    notification: notification-service.q
    authDlq: auth-service.dlq
    projectDlq: academic-project-service.dlq
    coordinatorDlq: coordinator-service.dlq
    departmentDlq: department-head-service.dlq
    notificationDlq: notification-service.dlq
  routing:
    userCreated: auth.user.created
    projectCreated: project.created
    projectUpdated: project.updated
    formatAApprovedByCoordinator: coordinator.formata.approved
    proposalApprovedByDeptHead: department.proposal.approved
    notificationAny: notification.send.*

# ======================================================
# Configuracion de Keycloak (Admin Client + Login OIDC)
# ======================================================
keycloak:
  # En dev: http://localhost:8181
  # En Docker: KEYCLOAK_URL=http://keycloak:8181
  server-url: ${KEYCLOAK_URL:http://localhost:8181}
  realm: ${KEYCLOAK_REALM:unicauca}

  # Cliente de negocio donde viven los roles (ESTUDIANTE, DOCENTE, etc.)
  desktop-client-id: ${KEYCLOAK_DESKTOP_CLIENT_ID:sistema-desktop}

  # Endpoint de tokens de Keycloak (para login con grant_type=password)
  token-url: ${KEYCLOAK_TOKEN_URL:${KEYCLOAK_URL:http://localhost:8181}/realms/${KEYCLOAK_REALM:unicauca}/protocol/openid-connect/token}

  admin:
    realm: ${KEYCLOAK_ADMIN_REALM:master}          # donde vive admin-cli
    client-id: ${KEYCLOAK_ADMIN_CLIENT_ID:admin-cli}
    username: ${KEYCLOAK_ADMIN_USER:admin}
    password: ${KEYCLOAK_ADMIN_PASS:admin}

# ======================================================
# Configuracion del servidor embebido (Tomcat)
# ======================================================
server:
  port: 8081

# ======================================================
# Actuator
# ======================================================
management:
  endpoints:
    web:
      exposure:
        include: health,info   # /actuator/health vía gateway: /api/auth/actuator/health

# ======================================================
# Configuracion de Swagger / OpenAPI
# ======================================================
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
    tagsSorter: alpha

# ======================================================
# Logs y formato basico
# ======================================================
logging:
  level:
    root: INFO
    org.springframework.web: INFO
    org.hibernate.SQL: DEBUG
  file:
    name: logs/${spring.application.name}.log
